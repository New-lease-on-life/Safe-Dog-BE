global:
  # Prometheus가 메트릭을 수집하는 주기 (15초마다 /actuator/prometheus 호출)
  scrape_interval: 15s
  # 평가 주기 (알림 규칙 평가 간격)
  evaluation_interval: 15s
  external_labels:
    monitor: 'safedog-monitor'

scrape_configs:
  # ── Spring Boot (SafeDogBe) ──────────────────────────────────────────────────
  - job_name: 'safedog-be'
    metrics_path: '/actuator/prometheus'
    static_configs:
      # 로컬 실행 (docker-compose up): Spring Boot가 호스트에서 실행 중일 때
      # host.docker.internal: Docker 컨테이너 → 호스트 접근용 DNS (Windows/Mac Docker Desktop 지원)
      # 안 될 경우 ipconfig로 확인한 실제 IPv4 주소로 교체 (예: 192.168.0.10:8080)
      - targets: [ 'host.docker.internal:8080' ]
        labels:
          env: 'local'

  # ── Prometheus 자체 메트릭 ────────────────────────────────────────────────────
  - job_name: 'prometheus'
    static_configs:
      - targets: [ 'localhost:9090' ]
