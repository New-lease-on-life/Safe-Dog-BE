# .github/workflows/deploy.yml
name: Deploy Spring Boot to EC2

on:
  push:
    branches: [ "main", "develop" ]

permissions:
  id-token: write # OIDC 인증 필수
  contents: read

env:
  ECR_REPOSITORY: safe_dog-api
  # [수정] 위에서 만든 GitHub Actions용 IAM 역할의 ARN 입력

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (본인 버전에 맞게 수정)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.IAM_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

        # [추가] gradlew 파일에 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and Push Docker Image (Jib 사용)
        run: |
          ./gradlew jib \
            -Djib.to.image=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }} \
            -Djib.to.tags=latest

      - name: Trigger EC2 Deploy Script via SSM
        run: |
          # [수정] 대상 EC2 인스턴스 ID를 GitHub Secrets에 저장 후 가져오기
          INSTANCE_ID="${{ secrets.EC2_INSTANCE_ID }}"
          
          # EC2 서버 내부의 deploy.sh 스크립트 실행 명령을 SSM으로 전송
          COMMAND="bash /home/ubuntu/cicd/deploy.sh"
          
          echo "Sending deployment command to EC2 via SSM..."
          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=InstanceIds,Values=$INSTANCE_ID" \
            --parameters "commands=[$COMMAND]" \
            --comment "Trigger Deploy Script" \
            --query "Command.CommandId" \
            --output text)
          
          echo "Command ID: $COMMAND_ID"
          
          # 루프를 통한 상태 모니터링 (기존 스크립트 로직 통합)
          echo "Waiting for command execution to complete..."
          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text)
            
            echo "Status: $STATUS ($i/30)"
            
            if [ "$STATUS" = "Success" ]; then
              echo "✅ Deployment succeeded!"
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "❌ Deployment failed with status: $STATUS"
              # 실패 시 EC2 로그 출력 (디버깅 용도)
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "{StandardErrorContent:StandardErrorContent,StandardOutputContent:StandardOutputContent}"
              exit 1
            fi
            sleep 10
          done

          echo "⚠️ Monitoring timeout: Deployment might still be in progress."
          exit 1
