services:

  # ── Prometheus ─────────────────────────────────────────────────────────────────
  # 역할: Spring Boot /actuator/prometheus 엔드포인트를 주기적으로 스크랩해 시계열 DB에 저장
  # 접속: http://localhost:9090
  prometheus:
    image: prom/prometheus:latest
    container_name: safedog-prometheus
    restart: unless-stopped
    volumes:
      # 스크랩 설정 파일을 컨테이너 내부에 마운트
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      # 수집 데이터 영속화 (컨테이너 재시작 시 데이터 유지)
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      # 보관 기간 15일 (용량 절약)
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - monitoring

  # ── Grafana ────────────────────────────────────────────────────────────────────
  # 역할: Prometheus에서 수집한 데이터를 대시보드로 시각화
  # 접속: http://localhost:3000  (기본 계정: admin / admin)
  grafana:
    image: grafana/grafana:latest
    container_name: safedog-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      # 첫 로그인 시 비밀번호 변경 강제 여부 (로컬 개발 편의상 비활성화)
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      # 대시보드·설정 영속화 (컨테이너 재시작 시 데이터 유지)
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - monitoring

# ── Volumes ────────────────────────────────────────────────────────────────────
volumes:
  prometheus_data:
  grafana_data:

# ── Networks ───────────────────────────────────────────────────────────────────
networks:
  monitoring:
    driver: bridge
