################################
#  여기는 prod(배포)용입니다.     #
################################

spring:
  config:
    activate:
      on-profile: prod
    # 운영 프로필(prod)이 활성화될 때만 AWS SSM에서 파라미터를 가져옴
    import: "aws-parameterstore:/safedog/prod/"
  # 1. 데이터베이스 설정
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 2. JPA & Hibernate 설정
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false # 운영 환경에서는 성능을 위해 false 권장
        show_sql: false
        use_sql_comments: false
        jdbc:
          time_zone: Asia/Seoul
    open-in-view: false

  # 3. Redis 설정
  data:
    redis:
      host: redis
      port: 6379

  # 4. OAuth2 설정
  security:
    oauth2:
      client:
        registration:
          naver:
            client-id: ${CLIENT_ID_NAVER}
            client-secret: ${CLIENT_SECRET_NAVER}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: ${REDIRECT_URI_NAVER}
            # birthyear, birthday: 만 14세 미만 가입 차단 검증용. 네이버 개발자 센터에서 해당 항목 동의 활성화 필요
            scope: name, email, birthyear, birthday
            client-name: Naver
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

# --------------------------------------------------
# 외부 라이브러리 및 독자 설정 (spring 계층 밖)
# --------------------------------------------------

# JWT 설정
jwt:
  access-token-secret: ${JWT_ACCSECRET}
  refresh-token-secret: ${JWT_REFSECRET}
  access-token-expiration: 1800000       # 30분
  refresh-token-expiration: 7776000000   # 90일 (90 * 24 * 60 * 60 * 1000)

# 로깅 설정
logging:
  level:
    root: info
    org.hibernate.SQL: warn

# Kakao API 전용 (독자 설정)
# 공공 데이터 추가

# 서버 설정
server:
  port: 8080
  forward-headers-strategy: native
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

cloud:
  aws:
    region:
      static: ap-northeast-2 # 서울 리전
    s3:
      bucket: safedog-bucket # S3 버킷 이름

# 앱 공통 설정
app:
  oauth2:
    redirect-uri-after-login: ${OAUTH2_REDIRECT_URI_AFTER_LOGIN:/}  # 소셜 로그인 성공 후 이동할 프론트엔드 URL
  cookie:
    secure: true  # 운영(HTTPS) 환경
    domain: ".bison56.com"
  cors:
    # 운영 환경 허용 Origin. AWS SSM 또는 환경변수로 쉼표 구분 문자열 설정 (예: "https://www.safedog.com,https://safedog.com")
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

management:
  endpoints:
    web:
      exposure:
        # health: 무중단 배포 스크립트(deploy.sh)가 살아있는지 확인할 때 사용
        # prometheus: 프로메테우스가 메트릭을 수집할 때 사용
        include: health, prometheus
  metrics:
    tags:
      application: SafeDogBe

firebase:
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:classpath:firebase-credentials.json}